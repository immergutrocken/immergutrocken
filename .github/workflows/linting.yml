name: linting

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  run-linting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      # pnpm 11 requires Node 22+, so don't rely on the runner default.
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install modules
        run: pnpm install
      - name: Run linting
        run: pnpm run lint;
