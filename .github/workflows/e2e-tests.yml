name: e2e-tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  # Argos resolves the pull request belonging to the head SHA via the GitHub API.
  pull-requests: read

jobs:
  run-e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"
      - name: Install modules
        run: pnpm install
      - name: Install Playwright WebKit
        run: pnpm --filter e2e exec playwright install --with-deps webkit
      - name: Run e2e tests
        run: pnpm run test:e2e
        env:
          # Uploads the screenshots to Argos, which then posts the visual diff check on the PR.
          ARGOS_TOKEN: ${{ secrets.ARGOS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: packages/e2e/playwright-report/
          retention-days: 7
